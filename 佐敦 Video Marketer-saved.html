<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Drone Experience</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'Noto Sans TC', 'sans-serif'],
                    },
                    colors: {
                        premium: {
                            dark: '#0a0a0c',
                            card: 'rgba(255, 255, 255, 0.05)',
                            accent: '#38bdf8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, #38bdf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .animate-fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-premium-dark text-white min-h-screen flex items-center justify-center p-6">

    <main class="max-w-6xl w-full">
        <div class="grid lg:grid-cols-12 gap-8 items-center">
            
            <!-- Video Column -->
            <div class="lg:col-span-7 animate-fade-in">
                <div class="relative group rounded-3xl overflow-hidden shadow-2xl border border-white/10">
                    <div class="absolute inset-0 bg-gradient-to-br from-blue-500/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                    <video src='https://opal.google/board/blobs/c407b50b-ab28-4f46-8f41-6b4de069013e' alt='media_1' class="w-full h-auto aspect-video object-cover" autoplay loop muted playsinline></video>
                </div>
            </div>

            <!-- Content Column -->
            <div class="lg:col-span-5 space-y-8">
                <div class="space-y-4 animate-fade-in" style="animation-delay: 0.2s;">
                    <span class="text-blue-400 font-semibold tracking-widest text-sm uppercase">Next Generation</span>
                    <h1 class="text-5xl md:text-6xl font-extrabold gradient-text leading-tight">
                        翱翔天際<br>極致視界
                    </h1>
                </div>

                <div class="grid gap-4 animate-fade-in" style="animation-delay: 0.4s;">
                    <!-- Card 1 -->
                    <div class="glass p-6 rounded-2xl hover:border-blue-500/50 transition-colors duration-300">
                        <p class="text-gray-300 leading-relaxed text-lg">
                            輕巧免執照「空拍機」讓一般大眾輕鬆起飛，AI 與 4K 規格讓您的創意在雲端釋放。
                        </p>
                    </div>

                    <!-- Card 2 -->
                    <div class="glass p-6 rounded-2xl hover:border-blue-500/50 transition-colors duration-300">
                        <p class="text-gray-300 leading-relaxed text-lg">
                            這款「空拍機」搭載全向避障，帶領一般大眾用上帝視角與一鍵短片完美記錄心動時刻。
                        </p>
                    </div>
                </div>

                <div class="animate-fade-in" style="animation-delay: 0.6s;">
                    <button class="px-8 py-4 bg-white text-black font-bold rounded-full hover:bg-blue-400 hover:text-white transition-all duration-300 transform hover:scale-105">
                        立即啟航
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full -z-10 overflow-hidden">
        <div class="absolute top-[-10%] right-[-5%] w-[500px] h-[500px] bg-blue-900/20 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] left-[-5%] w-[500px] h-[500px] bg-purple-900/10 rounded-full blur-[120px]"></div>
    </div>

</body>
</html>
