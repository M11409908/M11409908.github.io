<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Social Media Preview | M11409908</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #ededed;
        }
        .font-mono-custom { font-family: 'JetBrains Mono', monospace; }
        .glass-card {
            background: rgba(18, 18, 18, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .gradient-text {
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #3b82f6, #a855f7);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            filter: brightness(1.2);
            transform: translateY(-2px);
        }
        .image-shadow {
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8">

    <div class="max-w-5xl w-full glass-card rounded-[2rem] overflow-hidden shadow-2xl">
        <!-- Header -->
        <header class="p-6 border-b border-white/5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-500 to-purple-500"></div>
                <h1 class="text-lg font-semibold tracking-tight">AI Post Preview</h1>
            </div>
            <div class="text-xs font-mono-custom text-neutral-500 uppercase tracking-widest">v 1.0.2</div>
        </header>

        <!-- Main Content -->
        <div class="flex flex-col md:flex-row">
            <!-- Visual Column -->
            <div class="w-full md:w-1/2 p-6 md:p-8">
                <div class="relative group rounded-2xl overflow-hidden aspect-square image-shadow border border-white/10">
                    <img src='https://opal.google/board/blobs/ba3bb3e3-1550-4668-933c-ec5c6655773a' alt='Instagram Visual' class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                    <div class="absolute inset-0 bg-black/20 group-hover:bg-transparent transition-colors"></div>
                </div>
            </div>

            <!-- Text Column -->
            <div class="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-center">
                <div class="space-y-6">
                    <!-- Student ID -->
                    <div class="inline-block px-3 py-1 bg-white/5 border border-white/10 rounded-full">
                        <span class="font-mono-custom text-sm font-bold text-blue-400 tracking-wider">M11409908</span>
                    </div>

                    <!-- Caption Content -->
                    <div class="text-neutral-300 leading-relaxed space-y-4">
                        <p class="text-lg">終於完成了！🏊‍♂️ 日月潭橫渡達標成功！雖然過程很累，但浸泡在絕美湖水裡的感覺真的太值得了。✨ 挑戰自我，勇敢游向彼岸，這是一場與大自然和體力的熱血對話！🔥 收藏這份感動，我們明年見！🤘</p>
                        
                        <p class="text-blue-400 font-medium text-sm flex flex-wrap gap-2">
                            <span>#日月潭泳渡</span>
                            <span>#橫渡日月潭</span>
                            <span>#挑戰自我</span>
                            <span>#人生清單</span>
                            <span>#SunMoonLake</span>
                            <span>#SwimmingLife</span>
                            <span>#熱血人生</span>
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="p-6 md:px-8 pb-8 flex gap-4">
            <button onclick="alert('Caption copied to clipboard!')" class="flex-1 py-3 px-4 rounded-xl border border-white/10 hover:bg-white/5 transition-all font-medium text-sm">
                Copy Caption
            </button>
            <button onclick="alert('Image download initiated!')" class="flex-1 py-3 px-4 rounded-xl btn-gradient text-white font-medium text-sm shadow-lg shadow-blue-500/20">
                Download Image
            </button>
        </div>
    </div>

    <script>
        // Simple micro-interaction for smooth load
        document.addEventListener('DOMContentLoaded', () => {
            const card = document.querySelector('.glass-card');
            card.style.opacity = '0';
            card.style.transform = 'translateY(20px)';
            card.style.transition = 'all 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
            
            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body>
</html>
